name: Version diff

# Psalm's latest 6.x release vs its latest 7.x release on the perf corpus of vimeo/psalm master. See README.md.
# Runs on every push to this branch (new classifications included) and by hand.

on:
  push:
    branches: [version-diff]
  workflow_dispatch:
    inputs:
      old:
        description: Old Psalm tag (default latest 6.x release)
        required: false
        type: string
      new:
        description: New Psalm tag (default latest 7.x release)
        required: false
        type: string

permissions: {}

concurrency:
  group: version-diff
  cancel-in-progress: true

env:
  # Psalm 6 supports PHP up to 8.5; both versions run on the same PHP.
  PHP_VERSION: "8.5"
  PHP_EXTENSIONS: intl, bcmath, gmp, mbstring, pcntl, posix, sodium, zip, xml, dom, simplexml, tokenizer

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      old: ${{ steps.versions.outputs.old }}
      new: ${{ steps.versions.outputs.new }}
      perf_sha: ${{ steps.plan.outputs.perf_sha }}
    steps:
      - name: Checkout perf harness (vimeo/psalm master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: vimeo/psalm
          ref: master
          path: upstream
          sparse-checkout: bin/perf
          persist-credentials: false

      - name: Resolve versions
        id: versions
        env:
          INPUT_OLD: ${{ inputs.old }}
          INPUT_NEW: ${{ inputs.new }}
        run: |
          tags=$(git ls-remote --tags --refs https://github.com/vimeo/psalm | sed 's#.*refs/tags/##')
          latest() { grep -E "^v?$1\.[0-9]+\.[0-9]+$" <<< "$tags" | sort -V | tail -n 1; }
          old=${INPUT_OLD:-$(latest 6)}
          new=${INPUT_NEW:-$(latest 7)}
          for t in "$old" "$new"; do
            grep -qxF "$t" <<< "$tags" || { echo "::error title=Version diff::No tag '$t' on vimeo/psalm"; exit 1; }
          done
          echo "Psalm $old -> $new"
          { echo "old=$old"; echo "new=$new"; } >> "$GITHUB_OUTPUT"

      - name: Plan jobs
        id: plan
        env:
          OLD: ${{ steps.versions.outputs.old }}
          NEW: ${{ steps.versions.outputs.new }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          yq -o=json upstream/bin/perf/corpus.yml > "$RUNNER_TEMP/plan/corpus.json"
          # Install plus one analysis at three times the perf timeout, with slack.
          matrix=$(jq -c --arg old "$OLD" --arg new "$NEW" '{include: [
            .install_timeout as $i | .projects | to_entries[] | . as $p
            | ({major: "6", version: $old}, {major: "7", version: $new})
            | . + {project: $p.key, timeout_minutes: ((($i + 3 * $p.value.timeout) / 60 | ceil) + 15)}
          ]}' "$RUNNER_TEMP/plan/corpus.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "perf_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-diff-plan
          path: ${{ runner.temp }}/plan
          retention-days: 30

  analyse:
    name: ${{ matrix.project }} on ${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: tool
          persist-credentials: false

      - name: Checkout perf harness (same commit as the plan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: vimeo/psalm
          ref: ${{ needs.plan.outputs.perf_sha }}
          path: upstream
          sparse-checkout: bin/perf
          persist-credentials: false

      - name: Checkout Psalm ${{ matrix.version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: vimeo/psalm
          ref: refs/tags/${{ matrix.version }}
          path: psalm
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          ini-file: production
          tools: composer:v2
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
        env:
          fail-fast: true

      - name: Download corpus
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-diff-plan
          path: ${{ runner.temp }}/plan

      - name: Install Psalm
        env:
          COMPOSER_ROOT_VERSION: ${{ matrix.version }}
        run: composer install --working-dir=psalm --no-dev --no-scripts --no-interaction --no-progress

      - name: Analyse
        env:
          PROJECT: ${{ matrix.project }}
          MAJOR: ${{ matrix.major }}
        run: |
          tool/bin/run-project.sh "$RUNNER_TEMP/plan/corpus.json" "$PROJECT" psalm "$MAJOR" \
            upstream/bin/perf/perf.php "$RUNNER_TEMP/out/$MAJOR" "$RUNNER_TEMP/work"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-diff-${{ matrix.project }}-${{ matrix.major }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Report
    needs: [plan, analyse]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
        env:
          fail-fast: true

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: version-diff-*-[67]
          path: ${{ runner.temp }}/in

      - name: Compare
        env:
          OLD: ${{ needs.plan.outputs.old }}
          NEW: ${{ needs.plan.outputs.new }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report"
          mkdir -p "$report"
          php bin/version-diff.php report --in "$RUNNER_TEMP/in" --classifications classifications.json \
            --old "$OLD" --new "$NEW" --run-url "$RUN_URL" \
            --out-md "$report/report.md" --out-summary "$report/summary.md" --out-json "$report/diff.json"
          cat "$report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # Locks resolved by this run (projects without one in locks/): commit them to pin the dependencies.
          shopt -s nullglob
          for lock in "$RUNNER_TEMP"/in/*/6/locks/*/*.lock; do
            dest="$report/locks/$(basename "$(dirname "$lock")")"
            mkdir -p "$dest"
            cp "$lock" "$dest/"
          done
          if [ -d "$report/locks" ]; then
            {
              echo
              echo "⚠️ Dépendances non figées pour : $(ls "$report/locks" | tr '\n' ' ')"
              echo "Les locks générés sont dans l'artefact \`version-diff-report\` (\`locks/\`) : les copier dans \`locks/\` et commiter."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-diff-report
          path: ${{ runner.temp }}/report
          retention-days: 90
